<html>
  <body>
    {% for post in posts %}
    {% if post.author.username == "Susan" %}
      <h2>{{ post.author.title }}, {{ post.author.username }} says: <em>{{post.body}}</em></h2>
      {%else%}
      <p>{{ post.author.title }}, {{ post.author.username }} says: <em>{{post.body}}</em> </p>
    {% endif %}
  {% endfor %}
  </body>
</html>
